<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .experience-box {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .experience-box:hover {
            background-color: #f8f9fa;
        }
        .selected {
            background-color: #e7f3ff;
            border-color: #0d6efd;
        }
        .job-dates {
            color: #6c757d;
            font-size: 0.9em;
        }
        .company-name {
            color: #495057;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Resume Builder</h1>
        
        <!-- Job Titles Section -->
        <div class="row mb-4">
            <div class="col-12">
                <h3>Job Titles</h3>
                <div id="titles-container">
                    {% for title in titles %}
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="card-title">{{ title.title }}</h5>
                            <div class="company-name">{{ title.company }}</div>
                            <div class="job-dates">{{ title.start_date }} - {{ title.end_date }}</div>
                            <div class="selected-experiences mt-3"></div>
                            <button class="btn btn-primary btn-sm mt-2" onclick="addExperienceToTitle(this)">
                                Add Experience
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- Experience Pool Section -->
        <div class="row mb-4">
            <div class="col-12">
                <h3>Experience Pool</h3>
                <div id="experience-pool">
                    {% for experience in experiences %}
                    <div class="experience-box" onclick="toggleSelection(this)">
                        {{ experience }}
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- Build Resume Button -->
        <div class="row mb-4">
            <div class="col-12">
                <button class="btn btn-success" onclick="buildResume()">Build Resume</button>
            </div>
        </div>

        <!-- Final Resume Section -->
        <div class="row">
            <div class="col-12">
                <div id="final-resume" class="border p-4" style="display: none;">
                    <h2>Final Resume</h2>
                    <div id="resume-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSelection(element) {
            element.classList.toggle('selected');
        }

        function addExperienceToTitle(button) {
            const selectedExperiences = document.querySelectorAll('#experience-pool .selected');
            const targetTitle = button.closest('.card-body').querySelector('.selected-experiences');
            
            selectedExperiences.forEach(exp => {
                const newExp = document.createElement('div');
                newExp.className = 'alert alert-info mb-2 position-relative';
                newExp.innerHTML = `
                    ${exp.textContent.trim()}
                    <button type="button" class="btn-close position-absolute top-0 end-0 mt-2 me-2" 
                            onclick="removeExperience(this)"></button>
                `;
                targetTitle.appendChild(newExp);
                exp.classList.remove('selected');
            });
        }

        function removeExperience(button) {
            button.closest('.alert').remove();
        }

        function buildResume() {
            const titles = document.querySelectorAll('.card');
            const resumeData = [];

            titles.forEach(title => {
                const titleText = title.querySelector('.card-title').textContent;
                const company = title.querySelector('.company-name').textContent;
                const dates = title.querySelector('.job-dates').textContent;
                const experiences = Array.from(title.querySelectorAll('.selected-experiences .alert'))
                    .map(exp => exp.textContent.trim());

                if (experiences.length > 0) {
                    resumeData.push({
                        title: titleText,
                        company: company,
                        dates: dates,
                        experiences: experiences
                    });
                }
            });

            // Display the final resume
            const resumeContent = document.getElementById('resume-content');
            resumeContent.innerHTML = '';
            
            resumeData.forEach(job => {
                const jobSection = document.createElement('div');
                jobSection.className = 'mb-4';
                jobSection.innerHTML = `
                    <h3>${job.title}</h3>
                    <div class="company-name mb-2">${job.company}</div>
                    <div class="job-dates mb-3">${job.dates}</div>
                    <ul>
                        ${job.experiences.map(exp => `<li>${exp}</li>`).join('')}
                    </ul>
                `;
                resumeContent.appendChild(jobSection);
            });

            document.getElementById('final-resume').style.display = 'block';

            // Send data to server
            fetch('/build_resume', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(resumeData)
            });
        }
    </script>
</body>
</html>
